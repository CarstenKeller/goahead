<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e6b30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoAhead">
  <title>GoAhead Wanderkarte</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div id="map" aria-label="Karte"></div>

  <button id="locate-btn" class="map-btn" type="button" aria-label="Auf meine Position zentrieren" title="Auf meine Position zentrieren">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="currentColor"/>
      <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div id="status" role="status" aria-live="polite" hidden></div>

  <section id="info-panel" aria-label="Weg-Informationen" hidden>
    <div class="info-head">
      <span class="info-title">Wege an dieser Stelle</span>
      <button id="info-close" type="button" aria-label="Schließen">&times;</button>
    </div>
    <div id="info-body"></div>
  </section>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
