name: Kartendienste prüfen

# Prüft Kartendienste (Capabilities, CORS, Probe-Kacheln) – die Entwicklungsumgebung erreicht sie nicht.
on:
  workflow_dispatch:
  push:
    branches: [ccr-a56f7acc-f6tzvw]
    paths:
      - .github/scripts/probe_maps.py
      - .github/workflows/kartendienste.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/probe_maps.py && python3 .github/scripts/probe_maps.py 2 && python3 .github/scripts/probe_maps.py 3
