name: GitHub Pages

on:
  push:
    branches: [main, ccr-a56f7acc-f6tzvw, ccr-83c115d1-hn09z3]
  workflow_dispatch:
  # monatlich neu bauen, damit neue Wegzeichen (TFIS-Signaturen) übernommen werden
  schedule:
    - cron: "17 3 4 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Android-App (WebView + Aufzeichnung im Hintergrund), siehe android/README.md.
  # Signiert wird mit dem verschlüsselten Schlüssel android/goahead-keystore.jks.enc; das Passwort
  # steht im Repository-Secret GOAHEAD_KEYSTORE_PASSWORD. Ohne Secret: nur Probe-Build, keine APK auf der Seite.
  android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK bauen
        working-directory: android
        env:
          GOAHEAD_KEYSTORE_PASSWORD: ${{ secrets.GOAHEAD_KEYSTORE_PASSWORD }}
          GOAHEAD_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -e
          mkdir -p /tmp/apk
          if [ -n "$GOAHEAD_KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in goahead-keystore.jks.enc \
              -out /tmp/goahead.jks -pass env:GOAHEAD_KEYSTORE_PASSWORD
            export GOAHEAD_KEYSTORE_FILE=/tmp/goahead.jks
            gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk /tmp/apk/goahead.apk
            rm -f /tmp/goahead.jks
          else
            echo "::warning::Secret GOAHEAD_KEYSTORE_PASSWORD fehlt – nur Probe-Build (Debug), keine APK auf der Seite."
            unset GOAHEAD_KEYSTORE_PASSWORD
            gradle --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: goahead-apk
          path: /tmp/apk/
          if-no-files-found: ignore

  deploy:
    needs: android
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Wegzeichen der Wanderwege (SVG, benannt nach Signaturnummer) aus dem offiziellen
      # TFIS-Paket von Geobasis NRW (dl-de/zero-2.0). Schlägt das fehl, wird die App
      # trotzdem veröffentlicht – dann eben ohne Wegzeichen.
      - name: TFIS-Wegzeichen holen
        continue-on-error: true
        run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/tfis.zip https://www.opengeodata.nrw.de/produkte/geobasis/tfis_nrw/tfis_EPSG25832_GeoPackage.zip
          mkdir -p /tmp/tfis symbols/tfis
          unzip -q -o /tmp/tfis.zip 'svg_Dateien/Wanderwege/*' -d /tmp/tfis
          find /tmp/tfis/svg_Dateien/Wanderwege -name '*.svg' -exec cp {} symbols/tfis/ \;
          python3 .github/scripts/fix_svg_viewbox.py symbols/tfis
          echo "Wegzeichen: $(ls symbols/tfis | wc -l), Größe: $(du -sh symbols/tfis | cut -f1)"
      - name: Android-APK übernehmen (falls gebaut)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: goahead-apk
          path: app/
      - name: Quelltext der Android-App nicht veröffentlichen
        run: rm -rf android
      # Statische Seite ohne Build: Repository-Inhalt wird direkt ausgeliefert
      # (.git und .github werden von upload-pages-artifact ausgelassen)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
